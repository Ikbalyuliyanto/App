  <script src="assets/js/alert.js"></script>
  <script src="assets/js/config.js"></script>
<script>

  async function handleLogin(event) {
    event.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const remember = document.getElementById('remember').checked;

    if (!email || !password) {
      showAlert('Email dan password wajib diisi!', 'warning');
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        showAlert(
          data.message || 'Login gagal. Cek email dan password.',
          'error'
        );
        return;
      }

      // Simpan token dan nama user
      const storage = remember ? localStorage : sessionStorage;

      storage.setItem('token', data.token);

      const namaLengkap = [
        data.pengguna?.namaDepan,
        data.pengguna?.namaBelakang
      ].filter(Boolean).join(' ');

      storage.setItem('userNama', namaLengkap);

      showAlert(
        `Login berhasil! Selamat datang, ${namaLengkap}`,
        'success'
      );

      // Redirect ke returnUrl jika ada
      const params = new URLSearchParams(window.location.search);
      const returnUrl = params.get("returnUrl");

      setTimeout(() => {
        window.location.href = returnUrl || "/index.html";
      }, 800); // kasih jeda biar alert kelihatan

    } catch (error) {
      console.error(error);
      showAlert(
        'Terjadi kesalahan jaringan, silakan coba lagi.',
        'error'
      );
    }
  }
</script>
